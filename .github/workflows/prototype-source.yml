name: Prototype source checks
on:
  push:
    branches: [main, codex/grammar-local-trial-ba58b7d]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-source-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'CAPTW/pencil'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Governance and negative checks
        run: python scripts/validate_governance.py --root . --self-test
      - name: Install locked frontend dependencies
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts
      - name: Typecheck and frontend build
        if: ${{ !cancelled() }}
        run: npm run build:frontend
      - name: Pencil branding and rHWP formatting contracts
        if: ${{ !cancelled() }}
        run: |
          node scripts/test-pencil-branding.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test adapters/rhwp/tests/*.test.mjs
          exit $LASTEXITCODE
      - name: Provider and runtime contracts
        if: ${{ !cancelled() }}
        run: npm run test:provider
      - name: Capture contract
        if: ${{ !cancelled() }}
        run: node scripts/test-capture-contract.mjs
      - name: Chromium core
        if: ${{ !cancelled() }}
        run: node adapters/chromium/tests/core.test.mjs
      - name: Chromium worker
        if: ${{ !cancelled() }}
        run: node adapters/chromium/tests/worker.test.mjs
      - name: Chromium scheduling
        if: ${{ !cancelled() }}
        run: node --test adapters/chromium/tests/scheduling.test.mjs
      - name: Startup HTTP fixture disconnect regression
        if: ${{ !cancelled() }}
        run: python scripts/mission/test-gemma-startup-fixture.py
      - name: Rust regressions (ignored live tests excluded)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast -- --test-threads=1
      - name: Compile RichEdit transaction and capture probes (not GUI acceptance)
        if: ${{ !cancelled() }}
        run: ./scripts/mission/build-tsf-selected-probe.ps1 -OutputDirectory "$env:RUNNER_TEMP/pencil-tsf-probes" -ProbeNames apply-tsf,apply-tsf-binding
      - name: Broker startup failure and explicit retry integration
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --bin grammar-gemma-broker
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/mission/test-gemma-pre-ready.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/mission/test-gemma-launcher.py
          exit $LASTEXITCODE
      - name: Owned cleanup refusal regressions
        if: ${{ !cancelled() }}
        run: node --test scripts/test-owned-uninstall-data.mjs
      - name: Scope
        run: Write-Output 'Source checks only. No native desktop, GPU, model download, account access or Provider inference.'
