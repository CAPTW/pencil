name: Grammar candidate Windows validation
on:
  push:
    branches: [codex/grammar-autonomous-r1, claude/eloquent-faraday-hh62qc]
  workflow_dispatch:
    inputs:
      fault_injection:
        description: Deliberately fail one owned-desktop check to verify step isolation and failure evidence
        type: choice
        options: [none, input_environment]
        default: none
permissions:
  contents: read
concurrency:
  group: grammar-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-windows:
    if: ${{ github.repository == 'CAPTW/pencil' && (github.ref == 'refs/heads/codex/grammar-autonomous-r1' || github.ref == 'refs/heads/claude/eloquent-faraday-hh62qc') }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare owned evidence and declare limits
        run: |
          $e = Join-Path $env:RUNNER_TEMP 'grammar-evidence'
          New-Item -ItemType Directory -Path "$e/runtime","$e/resume-r1","$e/temp","$e/native","$e/logs" -Force | Out-Null
          "GRAMMAR_EVIDENCE=$e" >> $env:GITHUB_ENV
          @{
            source=$env:GITHUB_SHA; classification='SYNTHETIC_WINDOWS_CI'
            providerLive='NOT_RUN'; interactiveCapture='NOT_RUN'; ownedDesktop='SEE_NATIVE_RECEIPTS'
            productionToolbar='SEE_INSTALLED_BROWSER_RECEIPT'; release='NOT_AUTHORIZED'
          } | ConvertTo-Json > "$e/scope.json"
      # Every check below is its own step and runs after an earlier failure
      # (!cancelled), so one failing check never hides the others. Each step
      # tees its output into the evidence directory uploaded at the end.
      - name: Install locked frontend dependencies and build
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:frontend 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/frontend-build.log"
          exit $LASTEXITCODE
      - name: Provider and runtime JS contracts
        if: ${{ !cancelled() }}
        run: |
          npm run test:provider 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/provider-contracts.log"
          exit $LASTEXITCODE
      - name: Capture and Copy UI contract
        if: ${{ !cancelled() }}
        run: |
          node scripts/test-capture-contract.mjs 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/capture-contract.log"
          exit $LASTEXITCODE
      - name: Instant engine and benchmark contracts (Windows PowerShell 5.1 self-tests)
        if: ${{ !cancelled() }}
        run: |
          # Both contracts check committed bytes (LF-only files, corpus hashes), and
          # the runner's checkout may convert text to CRLF, so they run from an LF
          # worktree of the same commit. The engine contract's native-process and
          # UTF-8 JSON self-tests need Windows PowerShell 5.1 and task-owned roots;
          # without them those checks are NOT_RUN (exit 2), never PASS.
          $tree = Join-Path $env:RUNNER_TEMP 'instant-lf-tree'
          git -c core.autocrlf=false worktree add --detach $tree HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:P3_02_NATIVE_SELF_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'p3-02-native-self-test'
          $env:P3_02_UTF8_JSON_SELF_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'p3-02-utf8-json-self-test'
          node "$tree/scripts/test-instant-selection-engine-contract.mjs" 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/instant-engine-contract.log"
          $engine = $LASTEXITCODE
          node "$tree/scripts/test-instant-selection-benchmark-contract.mjs" 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/instant-benchmark-contract.log"
          $benchmark = $LASTEXITCODE
          git worktree remove --force $tree
          "engine_exit=$engine benchmark_exit=$benchmark"
          if ($engine -ne 0 -or $benchmark -ne 0) { exit 1 }
      - name: Chromium core contract
        if: ${{ !cancelled() }}
        run: |
          node adapters/chromium/tests/core.test.mjs 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/chromium-core.log"
          exit $LASTEXITCODE
      - name: Chromium worker contract
        if: ${{ !cancelled() }}
        run: |
          node adapters/chromium/tests/worker.test.mjs 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/chromium-worker.log"
          exit $LASTEXITCODE
      - name: Governance self-test
        if: ${{ !cancelled() }}
        run: |
          python scripts/validate_governance.py --root . --self-test 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/governance.log"
          exit $LASTEXITCODE
      - name: Rust regression tests (no ignored live tests)
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/rust-regression.log"
          exit $LASTEXITCODE
      - name: Owned Windows desktop - input environment
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GRAMMAR_OWNED_DESKTOP_FAULT: ${{ inputs.fault_injection || 'none' }}
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin codex-pencil p0_02_windows_live_tests::cloud_owned_desktop_input_environment -- --ignored --exact --test-threads=1 --nocapture 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/native/input-environment.log"
          exit $LASTEXITCODE
      - name: Owned Windows desktop - Copy-only boundary
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin codex-pencil p0_02_windows_live_tests::cloud_owned_desktop_copy_only_boundary -- --ignored --exact --test-threads=1 --nocapture 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/native/copy-only-boundary.log"
          exit $LASTEXITCODE
      - name: Owned Windows desktop - native Edit capture
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin codex-pencil native_edit_live_tests::cloud_owned_desktop_native_capture -- --ignored --exact --test-threads=1 --nocapture 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/native/native-capture.log"
          exit $LASTEXITCODE
      - name: Owned Windows desktop - native Edit Copy (no editor change)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin codex-pencil native_edit_live_tests::cloud_owned_desktop_native_apply -- --ignored --exact --test-threads=1 --nocapture 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/native/native-apply.log"
          exit $LASTEXITCODE
      - name: Owned Windows desktop - native Copy against application edits
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin codex-pencil native_edit_live_tests::cloud_owned_desktop_native_apply_against_application_edits -- --ignored --exact --test-threads=1 --nocapture 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/native/native-apply-application-edits.log"
          exit $LASTEXITCODE
      - name: Receipt-bound release build and personal package
        if: ${{ !cancelled() }}
        env:
          CARGO_BUILD_JOBS: '4'
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/test-personal-package.ps1 -Phase build 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/personal-build.log"
          exit $LASTEXITCODE
      - name: Install personal package into a fresh root
        if: ${{ !cancelled() }}
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          pwsh -NoProfile -File scripts/test-personal-package.ps1 -Phase install 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/personal-install.log"
          exit $LASTEXITCODE
      - name: Personal package failure and recovery paths
        if: ${{ !cancelled() && env.GRAMMAR_PACKAGE_ZIP != '' }}
        timeout-minutes: 10
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          pwsh -NoProfile -File scripts/test-personal-package.ps1 -Phase failures 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/personal-failures.log"
          exit $LASTEXITCODE
      - name: Build native host and synthetic process
        if: ${{ !cancelled() }}
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --bin grammar-chromium-host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --edition=2021 src-tauri/tests/runtime_mission/child.rs -o "$env:GRAMMAR_EVIDENCE/runtime/child.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "GRAMMAR_HOST_EXE=$env:GITHUB_WORKSPACE/src-tauri/target/debug/grammar-chromium-host.exe" >> $env:GITHUB_ENV
      - name: Native framing and synthetic Deep lifecycle
        if: ${{ !cancelled() }}
        run: |
          python adapters/chromium/host/test_host.py "$env:GRAMMAR_HOST_EXE" 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/host-framing.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python adapters/chromium/host/test_host_deep.py "$env:GRAMMAR_HOST_EXE" "$env:GRAMMAR_EVIDENCE/runtime/child.exe" "$env:GRAMMAR_EVIDENCE/host-deep" 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/host-deep.log"
          exit $LASTEXITCODE
      - name: Native runtime matrix (original budgets)
        if: ${{ !cancelled() }}
        run: |
          $env:MISSION_FIXTURE_EXE="$env:GRAMMAR_EVIDENCE/runtime/child.exe"
          $env:MISSION_EVIDENCE="$env:GRAMMAR_EVIDENCE/runtime"
          $env:TEMP="$env:GRAMMAR_EVIDENCE/temp"; $env:TMP=$env:TEMP
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin codex-pencil runtime_mission:: -- --include-ignored --test-threads=1 --nocapture --skip runtime_mission::endurance 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/runtime-matrix.log"
          exit $LASTEXITCODE
      - name: Native runtime endurance and loaded reproduction
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $env:MISSION_FIXTURE_EXE="$env:GRAMMAR_EVIDENCE/runtime/child.exe"
          $env:MISSION_EVIDENCE="$env:GRAMMAR_EVIDENCE/runtime"
          $env:TEMP="$env:GRAMMAR_EVIDENCE/temp"; $env:TMP=$env:TEMP
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin codex-pencil runtime_mission::endurance::native_runtime_endurance -- --ignored --exact --test-threads=1 --nocapture 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/runtime-endurance.log"
          exit $LASTEXITCODE
      - name: Install isolated browser test dependency
        if: ${{ !cancelled() }}
        run: |
          $tools=Join-Path $env:RUNNER_TEMP 'grammar-browser-tools'
          npm install --prefix "$tools" --no-save --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pw=Join-Path $tools 'node_modules/playwright'
          node "$pw/cli.js" install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "GRAMMAR_PLAYWRIGHT=$pw" >> $env:GITHUB_ENV
          $browser=node -e "console.log(require(process.argv[1]).chromium.executablePath())" "$pw"
          "GRAMMAR_CHROMIUM=$browser" >> $env:GITHUB_ENV
      - name: Installed package in Chromium (unmodified extension, installer host, toolbar gesture)
        if: ${{ !cancelled() && env.GRAMMAR_INSTALL_ROOT != '' }}
        timeout-minutes: 8
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          node adapters/chromium/tests/installed-package.test.mjs 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/chromium-installed.log"
          exit $LASTEXITCODE
      - name: Built app user flow (Instant, Copy, synthetic Deep, cancel, clipboard held, restart)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          if (-not $env:GRAMMAR_APP_EXE) {
            # Packaging failed: exercise the unpackaged release build of the same source instead.
            $fallback = Get-ChildItem "$env:GRAMMAR_EVIDENCE/personal" -Recurse -Filter codex-pencil.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($fallback) { $env:GRAMMAR_APP_EXE = $fallback.FullName; $env:GRAMMAR_APP_KIND = 'unpackaged-release-build' }
          }
          node scripts/test-app-flow-e2e.mjs 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/app-flow.log"
          exit $LASTEXITCODE
      - name: Chromium modified isolated extension fixture and synthetic Deep integration
        if: ${{ !cancelled() }}
        run: |
          $env:GRAMMAR_SYNTHETIC_DEEP='1'; $env:GRAMMAR_ACTIVE_TAB='0'
          $env:CODEX_PENCIL_CLAUDE_BIN="$env:GRAMMAR_EVIDENCE/runtime/child.exe"
          $env:P01_FIXTURE_MODE='success'
          $env:P01_CASE_DIR="$env:GRAMMAR_EVIDENCE/resume-r1/browser-deep"
          # Regress the installed package when it exists; otherwise the source build.
          if ($env:GRAMMAR_INSTALLED_HOST) { $env:GRAMMAR_HOST_EXE=$env:GRAMMAR_INSTALLED_HOST; $env:GRAMMAR_EXTENSION_DIR=$env:GRAMMAR_INSTALLED_EXTENSION }
          node adapters/chromium/tests/browser.test.mjs 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/chromium-browser.log"
          exit $LASTEXITCODE
      - name: Remove personal package and verify no residue
        if: ${{ always() && env.GRAMMAR_PACKAGE_ZIP != '' }}
        run: |
          $env:GRAMMAR_OWNED_DESKTOP_TEST='1'
          pwsh -NoProfile -File scripts/test-personal-package.ps1 -Phase remove 2>&1 | Tee-Object "$env:GRAMMAR_EVIDENCE/logs/personal-remove.log"
          exit $LASTEXITCODE
      - name: Bind step receipts to the exact source commit
        if: ${{ always() }}
        run: |
          $e = $env:GRAMMAR_EVIDENCE
          $receipts = @(Get-ChildItem "$e/native" -Filter *.json -ErrorAction SilentlyContinue | ForEach-Object {
            $r = Get-Content $_.FullName -Raw | ConvertFrom-Json
            [ordered]@{ test = $r.test; status = $r.status; source_sha = $r.source_sha; last_completed_check = $r.last_completed_check }
          })
          # The built-app flow and the installed-package browser test bind to the source too.
          $receipts += @(Get-Item "$e/app-flow/result.json", "$e/installed-browser/result.json" -ErrorAction SilentlyContinue | ForEach-Object {
            $r = Get-Content $_.FullName -Raw | ConvertFrom-Json
            [ordered]@{ test = $_.Directory.Name; status = $r.status; source_sha = $r.source_sha; last_completed_check = @($r.checks)[-1] }
          })
          [ordered]@{
            source_sha = $env:GITHUB_SHA; ref = $env:GITHUB_REF; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            owned_desktop_receipts = $receipts
            receipts_bound_to_source = (@($receipts | Where-Object { $_.source_sha -ne $env:GITHUB_SHA }).Count -eq 0)
          } | ConvertTo-Json -Depth 4 | Set-Content "$e/summary.json"
          Get-Content "$e/summary.json"
          # Receipts are content-free; print them so the log alone is sufficient evidence.
          $printed = @(
            Get-ChildItem "$e/native", "$e/personal" -Filter *.json -ErrorAction SilentlyContinue
            Get-Item "$e/app-flow/result.json", "$e/installed-browser/result.json", "$e/runtime/endurance-receipt.json", "$e/runtime/deep-boundary-receipt.json", "$e/host-deep/receipt.json" -ErrorAction SilentlyContinue
            Get-ChildItem "$e" -Directory -Filter 'browser-*' -ErrorAction SilentlyContinue | ForEach-Object { Get-Item "$($_.FullName)/result.json", "$($_.FullName)/failure.json" -ErrorAction SilentlyContinue }
          )
          foreach ($file in $printed) { "RECEIPT $([IO.Path]::GetRelativePath($e, $file.FullName))"; Get-Content $file.FullName -Raw }
      - name: Upload synthetic evidence (no executable release)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grammar-synthetic-evidence-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/grammar-evidence/scope.json
            ${{ runner.temp }}/grammar-evidence/summary.json
            ${{ runner.temp }}/grammar-evidence/native/*.json
            ${{ runner.temp }}/grammar-evidence/native/*.log
            ${{ runner.temp }}/grammar-evidence/logs/*.log
            ${{ runner.temp }}/grammar-evidence/host-deep/receipt.json
            ${{ runner.temp }}/grammar-evidence/app-flow/result.json
            ${{ runner.temp }}/grammar-evidence/installed-browser/result.json
            ${{ runner.temp }}/grammar-evidence/runtime/endurance-receipt.json
            ${{ runner.temp }}/grammar-evidence/runtime/deep-boundary-receipt.json
            ${{ runner.temp }}/grammar-evidence/personal/*.json
            ${{ runner.temp }}/grammar-evidence/browser-*/result.json
            ${{ runner.temp }}/grammar-evidence/browser-*/failure.json
